name: Native Mono baseline
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_native_mono.py'
      - '.github/workflows/native-mono.yml'
permissions:
  contents: read
jobs:
  mono:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          cmake --version
          ninja --version
      - name: Build upstream JIT-enabled Mono baseline
        run: python3 scripts/build_native_mono.py
      - uses: actions/upload-artifact@v4
        with:
          name: mono-arm64-baseline-not-device-ready
          path: .native-build/mono/mono/mini/*.a
          if-no-files-found: error
          retention-days: 7
