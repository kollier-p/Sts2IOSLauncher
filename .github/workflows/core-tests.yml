name: Stage 1 - build and offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Launcher.Steam/Launcher.Steam.csproj -c Release
      - run: dotnet run --project tests/Launcher.Core.Tests/Launcher.Core.Tests.csproj -c Release
