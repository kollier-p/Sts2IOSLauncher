name: Managed native host compilation
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/managed-host-tests.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - run: dotnet build src/Launcher.Host/Launcher.Host.csproj -c Release
      - run: dotnet build src/STS2JitSupport/STS2JitSupport.csproj -c Release
      - run: dotnet build src/Launcher.AdapterTool/Launcher.AdapterTool.csproj -c Release
