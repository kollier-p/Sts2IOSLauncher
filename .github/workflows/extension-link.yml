name: Native extension link validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/integrate_extensions.py'
      - '.github/workflows/extension-link.yml'
permissions:
  contents: read
jobs:
  link:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stage_extensions.py .native-build/extensions
      - name: Validate static extension linking
        run: |
          mkdir -p .native-build/link-test.xcodeproj
          printf 'OTHER_LDFLAGS = "-ObjC";\n' > .native-build/link-test.xcodeproj/project.pbxproj
          python3 scripts/integrate_extensions.py .native-build/link-test.xcodeproj .native-build/extensions
          cat .native-build/link-test.xcodeproj/project.pbxproj
          printf 'int main(){return 0;}\n' > .native-build/link-test.cpp
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" .native-build/link-test.cpp $(for f in .native-build/NativeExtensions/*.a; do printf '%s ' "-Wl,-force_load,$f"; done) -framework Foundation -framework UIKit -framework AudioToolbox -framework AVFoundation -framework CoreAudio -framework CoreMedia -o .native-build/link-test
