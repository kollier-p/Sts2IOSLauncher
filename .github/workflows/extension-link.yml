name: Native extension link validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ExtensionSupport.mm'
      - 'scripts/stage_extensions.py'
      - 'scripts/integrate_extensions.py'
      - '.github/workflows/extension-link.yml'
permissions:
  contents: read
jobs:
  link:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/stage_extensions.py .native-build/extensions
      - name: Validate ARM64 extension framework linkage
        run: |
          python3 scripts/integrate_extensions.py .native-build/extensions .native-build/ExtensionFrameworks
          cat > .native-build/link-test.cpp <<'CPP'
          extern "C" unsigned char fmod_library_init(void *, void *, void *);
          extern "C" unsigned char spine_godot_library_init(void *, void *, void *);
          int main() {
              return fmod_library_init(nullptr, nullptr, nullptr) + spine_godot_library_init(nullptr, nullptr, nullptr);
          }
          CPP
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" .native-build/link-test.cpp native/ExtensionSupport.mm \
            -F .native-build/ExtensionFrameworks -framework Sts2Fmod -framework Sts2Spine \
            -Wl,-export_dynamic -o .native-build/link-test
          xcrun lipo -verify_arch arm64 .native-build/link-test
          xcrun otool -L .native-build/link-test
