name: Build IPA
on:
  workflow_dispatch:
    inputs:
      include_extensions:
        description: "Build and verify an extension-enabled IPA on the runner for authorized evaluation"
        type: boolean
        default: false
      upload_extension_ipa:
        description: "Publish the unsigned FMOD and Spine IPA as a downloadable artifact"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    uses: ./.github/workflows/native-mono-patched.yml
    with:
      include_extensions: ${{ inputs.include_extensions }}
      package_ipa: true
      upload_extension_ipa: ${{ inputs.upload_extension_ipa }}
