name: Native Godot pre-IPA build
on:
  workflow_dispatch:
    inputs:
      include_extensions:
        description: "Include FMOD/Spine (builder confirms applicable licensing)"
        type: boolean
        default: false
  push:
    paths:
      - 'native/**'
      - 'scripts/build_native_mono.py'
      - 'scripts/stage_ios_runtime.py'
      - 'scripts/build_godot_host.py'
      - 'scripts/validate_native_app.py'
      - 'scripts/stage_extensions.py'
      - 'scripts/integrate_extensions.py'
      - 'scripts/build_extension_fixtures.py'
      - 'src/**'
      - '.github/workflows/native-mono-patched.yml'
permissions:
  contents: read
concurrency:
  group: native-pre-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mono:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_native_mono.py --patched
      - name: Compile memory alias implementation
        run: |
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -fobjc-arc -c native/mono/MonoJitMemory.mm -o .native-build/mono-patched/MonoJitMemory.o
          xcrun lipo -verify_arch arm64 .native-build/mono-patched/MonoJitMemory.o
      - name: Link independent game runtime framework binary
        run: |
          mkdir -p .native-build/framework
          xcrun --sdk iphoneos clang++ -dynamiclib -arch arm64 -miphoneos-version-min=16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -fobjc-arc native/GameRuntime.mm native/JitProbe.mm native/LaunchRequest.mm native/Keychain.mm .native-build/mono-patched/MonoJitMemory.o $(for f in .native-build/mono-patched/mono/mini/libmonosgen-2.0.a .native-build/mono-patched/mono/mini/libmono-component-*-static.a; do printf '%s ' "-Wl,-force_load,$f"; done) -framework Foundation -framework Security -lz -liconv -Wl,-install_name,@rpath/sts2.framework/sts2 -o .native-build/framework/sts2
          xcrun lipo -verify_arch arm64 .native-build/framework/sts2
      - name: Stage pinned iOS managed runtime
        run: python3 scripts/stage_ios_runtime.py .native-build/runtime-distribution
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - name: Build managed launcher and runtime adapters
        run: |
          dotnet publish src/Launcher.Host/Launcher.Host.csproj -c Release -o .native-build/runtime-distribution/Managed
          dotnet build src/STS2JitSupport/STS2JitSupport.csproj -c Release -o .native-build/runtime-distribution/Managed
          dotnet run --project src/Launcher.AdapterTool/Launcher.AdapterTool.csproj -c Release -- corelib .native-build/runtime-distribution/Managed/System.Private.CoreLib.dll .native-build/runtime-distribution/Managed/STS2JitSupport.dll .native-build/CoreLib.patched.dll
          mv .native-build/CoreLib.patched.dll .native-build/runtime-distribution/Managed/System.Private.CoreLib.dll
      - name: Compile licensed native extension inputs
        if: inputs.include_extensions == true || vars.INCLUDE_NATIVE_EXTENSIONS == 'true'
        run: python3 scripts/stage_extensions.py .native-build/extensions
      - name: Compile and validate staged Godot app
        env:
          INCLUDE_EXTENSIONS: ${{ inputs.include_extensions == true || vars.INCLUDE_NATIVE_EXTENSIONS == 'true' }}
        run: |
          args=()
          if [ "$INCLUDE_EXTENSIONS" = "true" ]; then args+=(--extensions); fi
          python3 scripts/build_godot_host.py "${args[@]}"
      - name: Compile Godot with extension integration fixtures
        if: inputs.include_extensions != true && vars.INCLUDE_NATIVE_EXTENSIONS != 'true'
        run: python3 scripts/build_godot_host.py --extension-fixtures
      - name: Preserve pre-IPA build output
        if: inputs.include_extensions != true && vars.INCLUDE_NATIVE_EXTENSIONS != 'true'
        run: |
          tar -czf .native-build/staged-app.tar.gz -C .native-build/godot-derived/Build/Products/Release-iphoneos Sts2Host.app
      - uses: actions/upload-artifact@v4
        if: inputs.include_extensions != true && vars.INCLUDE_NATIVE_EXTENSIONS != 'true'
        with:
          name: STS2IOSLauncher-pre-ipa
          include-hidden-files: true
          path: |
            .native-build/staged-app.tar.gz
            .native-build/pre-ipa-report.json
            .native-build/extension-fixture-app/pre-ipa-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: patched-mono-arm64
          include-hidden-files: true
          path: |
            .native-build/mono-patched/mono/mini/*.a
            .native-build/mono-patched/MonoJitMemory.o
            .native-build/framework/sts2
            .native-build/runtime-distribution/
          if-no-files-found: error
