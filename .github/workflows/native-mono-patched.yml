name: Native Godot IPA (experimental)
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'scripts/build_native_mono.py'
      - 'scripts/stage_ios_runtime.py'
      - 'scripts/build_godot_host.py'
      - 'scripts/package_native_ipa.py'
      - 'src/**'
      - '.github/workflows/native-mono-patched.yml'
permissions:
  contents: read
jobs:
  mono:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_native_mono.py --patched
      - name: Compile memory alias implementation
        run: |
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -fobjc-arc -c native/mono/MonoJitMemory.mm -o .native-build/mono-patched/MonoJitMemory.o
          xcrun lipo -verify_arch arm64 .native-build/mono-patched/MonoJitMemory.o
      - name: Link independent game runtime framework binary
        run: |
          mkdir -p .native-build/framework
          xcrun --sdk iphoneos clang++ -dynamiclib -arch arm64 -miphoneos-version-min=16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -fobjc-arc native/GameRuntime.mm native/JitProbe.mm native/LaunchRequest.mm .native-build/mono-patched/MonoJitMemory.o $(for f in .native-build/mono-patched/mono/mini/libmonosgen-2.0.a .native-build/mono-patched/mono/mini/libmono-component-*-static.a; do printf '%s ' "-Wl,-force_load,$f"; done) -framework Foundation -framework Security -lz -liconv -Wl,-install_name,@rpath/sts2.framework/sts2 -o .native-build/framework/sts2
          xcrun lipo -verify_arch arm64 .native-build/framework/sts2
      - name: Stage pinned iOS managed runtime
        run: python3 scripts/stage_ios_runtime.py .native-build/runtime-distribution
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.318
      - name: Build managed launcher and runtime adapters
        run: |
          dotnet publish src/Launcher.Host/Launcher.Host.csproj -c Release -o .native-build/runtime-distribution/Managed
          dotnet build src/STS2JitSupport/STS2JitSupport.csproj -c Release -o .native-build/runtime-distribution/Managed
          dotnet run --project src/Launcher.AdapterTool/Launcher.AdapterTool.csproj -c Release -- corelib .native-build/runtime-distribution/Managed/System.Private.CoreLib.dll .native-build/runtime-distribution/Managed/STS2JitSupport.dll .native-build/CoreLib.patched.dll
          mv .native-build/CoreLib.patched.dll .native-build/runtime-distribution/Managed/System.Private.CoreLib.dll
      - name: Export Godot host and package experimental IPA
        run: python3 scripts/build_godot_host.py
      - uses: actions/upload-artifact@v4
        with:
          name: STS2IOSLauncher-native-experimental-ipa
          path: dist/STS2IOSLauncher-native-experimental.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: patched-mono-arm64
          path: |
            .native-build/mono-patched/mono/mini/*.a
            .native-build/mono-patched/MonoJitMemory.o
            .native-build/framework/sts2
            .native-build/runtime-distribution/
          if-no-files-found: error
